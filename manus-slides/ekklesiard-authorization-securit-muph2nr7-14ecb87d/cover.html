<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans', sans-serif; color: #161616; background-color: #F4F5F6; }
    .slide-container {
      width: 1280px;
      min-height: 720px;
      background: #F4F5F6;
      display: flex;
      flex-direction: column;
      padding: 48px;
      position: relative;
    }
    .motif-tr { position: absolute; top: 24px; right: 24px; color: #C6C6C6; font-family: 'IBM Plex Mono'; font-size: 24px; }
    .motif-bl { position: absolute; bottom: 24px; left: 24px; color: #C6C6C6; font-family: 'IBM Plex Mono'; font-size: 24px; }
    .content { flex: 1; display: flex; align-items: center; justify-content: space-between; }
    .title-area { width: 66%; }
    .title { font-size: 56px; font-weight: 500; line-height: 1.1; margin-bottom: 24px; }
    .subtitle { font-size: 24px; color: #525252; font-family: 'IBM Plex Mono'; border-left: 4px solid #D94E18; padding-left: 20px; }
    .graphic-area { width: 30%; display: flex; justify-content: flex-end; align-items: center; }
    .large-motif { font-size: 240px; color: #C6C6C6; font-family: 'IBM Plex Mono'; }
    .footer { position: absolute; bottom: 48px; right: 48px; font-family: 'IBM Plex Mono'; font-size: 14px; color: #525252; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif-tr">+</div>
    <div class="motif-bl">+</div>
    <div class="content">
      <div class="title-area">
        <h1 class="title">ekklesiaRD<br>Authorization & Security Review</h1>
        <p class="subtitle">A Layered Boundary System</p>
      </div>
      <div class="graphic-area">
        <div class="large-motif">+</div>
      </div>
    </div>
    <div class="footer">PAGE 01</div>
  </div>
</body>
</html>
