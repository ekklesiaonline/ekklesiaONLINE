; ekklesiaONLINE — PHP overrides for HostGator shared hosting (LSAPI/FPM).
;
; This file is `.user.ini`: PHP reads it per-directory from the docroot
; (public/) on CGI/FPM-style SAPIs — which is what HostGator's CloudLinux
; LSAPI uses. It is ignored by mod_php, so local Apache dev is unaffected.
;
; SCOPE — only PHP_INI_PERDIR / PHP_INI_ALL directives are honored here.
; PHP_INI_SYSTEM directives (most opcache.* sizing, realpath_cache_*,
; allow_url_*, disable_functions, open_basedir, extension=) CANNOT be set
; per-directory — they are silently ignored and host defaults apply.
; opcache.validate_timestamps / opcache.revalidate_freq ARE per-dir
; settable and are set below so rsync deploys are picked up.
;
; NOTE: CloudLinux mod_lsapi only reads .user.ini when the host enables
; `lsapi_enable_user_ini On`. Verify via phpinfo() (web, not CLI) after
; deploy; if values are not applied, rely on the hPanel editor values.
;
; The hPanel php.ini editor covers the same resource limits below — keeping
; both in sync is intentional: whichever file the handler honors, the
; values match. If the editor writes its own .user.ini/php.ini into
; public/, it may replace this file on the server — the hPanel values
; below are the authoritative copy for resource limits.
;
; Changes take up to user_ini.cache_ttl (default 300s) to take effect.
; This file does NOT affect the CLI SAPI (`php spark`, cron) — CLI uses
; the php.ini selected in hPanel → Select PHP Version → Options.

; ── Resource limits ──────────────────────────────────────────────────
; Web requests only. These are requested ceilings, not guaranteed values:
; HostGator's published shared-hosting caps may clamp them lower (currently
; documented as memory_limit 256M, max_execution_time 30, max_input_time 60).
; Keep in sync with the highest values the hPanel php.ini editor actually applies.
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000
; post_max_size > upload_max_filesize to leave room for multipart overhead
; and other form fields.
post_max_size = 40M
upload_max_filesize = 32M

; ── OPcache revalidation (per-dir settable) ─────────────────────────
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; ── Timezone ─────────────────────────────────────────────────────────
; Match app.Config\App::$appTimezone (UTC). CI4 sets this itself at boot,
; but keeping php.ini consistent avoids surprises in raw-PHP paths and
; makes `php -r`/cron probes agree with the app. (hPanel editor has no
; timezone field — this is the only place it can be set.)
date.timezone = UTC

; ── Error handling ───────────────────────────────────────────────────
; Never display errors to browsers in production; log them instead.
; CI4's own logger writes to writable/logs/ — these settings govern PHP
; engine-level errors (fatals, warnings outside the framework).
; (hPanel editor only exposes display_errors — the rest live here.)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Security ─────────────────────────────────────────────────────────
expose_php = Off

; Deliberately NOT set here:
;   session.*          — CI4 FileHandler manages writable/session + its own
;                        GC/expiration; PHP's session.gc_maxlifetime and
;                        session.save_path are irrelevant to it.
;   zlib.output_compression — leave Disabled in hPanel (default); CI4 does
;                        not need PHP-level output compression.
;   open_basedir / disable_functions — HostGator platform hardening.
