<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans', sans-serif; color: #161616; background-color: #F4F5F6; }
    .slide-container { width: 1280px; min-height: 720px; background: #F4F5F6; display: flex; flex-direction: column; padding: 48px; position: relative; }
    .motif-tr { position: absolute; top: 24px; right: 24px; color: #C6C6C6; font-family: 'IBM Plex Mono'; font-size: 24px; }
    .motif-bl { position: absolute; bottom: 24px; left: 24px; color: #C6C6C6; font-family: 'IBM Plex Mono'; font-size: 24px; }
    .content { flex: 1; display: flex; align-items: center; justify-content: center; }
    .target-state { font-size: 56px; font-weight: 500; text-align: center; border: 1px solid #C6C6C6; padding: 64px; background: #FFFFFF; }
    .accent { color: #D94E18; }
    .footer { position: absolute; bottom: 48px; right: 48px; font-family: 'IBM Plex Mono'; font-size: 14px; color: #525252; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif-tr">+</div>
    <div class="motif-bl">+</div>
    <div class="content">
      <div class="target-state">
        A Uniform, <span class="accent">Fail-Closed</span><br>Authorization and Audit Model.
      </div>
    </div>
    <div class="footer">PAGE 08</div>
  </div>
</body>
</html>
