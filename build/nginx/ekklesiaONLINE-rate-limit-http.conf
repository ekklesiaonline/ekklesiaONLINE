# ekklesiaONLINE reverse-proxy hardening snippet (Nginx) - http {} context.
# Include this from the http {} block. limit_*_zone and map are only valid
# in http context; the server-level rules live in ekklesiaONLINE-rate-limit.conf.

# If your auth gateway injects auth context headers, map anonymous vs authenticated.
# Default is treated as anonymous.
map $http_x_authenticated_user $is_authenticated {
    default 0;
    "1" 1;
}

# limit_req cannot be used inside if {}. Instead, give each write zone a key
# that is empty for the other client class: requests with an empty key are
# not counted against a zone, so both limit_req directives can be applied
# unconditionally and each only affects its own class.
map $is_authenticated $write_auth_key {
    1 $binary_remote_addr;
    default "";
}

map $is_authenticated $write_anon_key {
    1 "";
    default $binary_remote_addr;
}

# Connection and request-rate zones.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=10r/m;
limit_req_zone $write_auth_key zone=write_per_ip:20m rate=60r/m;
limit_req_zone $write_anon_key zone=write_anon_per_ip:20m rate=20r/m;
