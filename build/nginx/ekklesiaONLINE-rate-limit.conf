# ekklesiaONLINE reverse-proxy hardening snippet (Nginx)
# Include this from the server {} block serving ekklesiaONLINE.local.

# Track clients by trusted real IP if behind CDN/LB.
# Adjust these ranges to your infrastructure.
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Connection and request-rate zones.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=write_per_ip:20m rate=60r/m;
limit_req_zone $binary_remote_addr zone=write_anon_per_ip:20m rate=20r/m;

# If your auth gateway injects auth context headers, map anonymous vs authenticated.
# Default is treated as anonymous.
map $http_x_authenticated_user $is_authenticated {
    default 0;
    "1" 1;
}

# Request body and parser hardening.
client_max_body_size 12m;
client_body_buffer_size 256k;
client_body_timeout 15s;
client_header_timeout 15s;
keepalive_timeout 30s;
send_timeout 30s;

# Optional parser hardening for malformed headers.
ignore_invalid_headers on;
large_client_header_buffers 4 16k;

# Global per-IP connection cap to reduce DDoS socket pressure.
limit_conn conn_per_ip 40;

# Login brute-force defense.
location = /login {
    limit_req zone=login_per_ip burst=10 nodelay;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass php-fpm;
}

# High-risk write endpoints (aligned to CI app limiter).
location ~* ^/(province/(create-diocese|assign-diocesan-admin|create-admin)|diocesan/registrations/|members/(store|update|delete|transfer|reassign|attach-parish|detach-parish|set-home-parish|province-staff/)|guests/(store|update|delete)|visitors/(store|update|delete|promote|revert-conversion|promote-attender|demote)|followup/(store|update-status|delete)|events/(store|update|delete|register|registrations/.+/status)|services/(store|update|delete)|attendance/(mark|bulk-mark)|donations/(store|delete)|expenses/(store|update|delete)|budgets/save|volunteers/(store-team|add-member|remove-member|schedules/)|families/(store|update|delete|addMember|removeMember)|pledges/(store|update|delete)|leadership/(store|update|delete)|standing/refresh|profile/(update|delete-picture|complete)) {
    # Allow short bursts while blocking sustained abuse.
    if ($is_authenticated) {
        limit_req zone=write_per_ip burst=30 nodelay;
    }
    if ($is_authenticated = 0) {
        limit_req zone=write_anon_per_ip burst=10 nodelay;
    }

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass php-fpm;
}

# Optional: static fallback location for all remaining PHP routes.
location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass php-fpm;
}
